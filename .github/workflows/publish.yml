# Publishes to npm via trusted publishing (OIDC) — no tokens stored anywhere.
#
# One-time setup: on npmjs.com, package settings -> Trusted Publisher ->
# GitHub Actions, repository mgaspari/bubble-sheet, workflow publish.yml,
# allowed action Publish.
#
# A release happens whenever main carries a version npm does not have yet —
# so releasing is: bump "version" in package.json, push to main. Tags and
# GitHub releases also trigger it, and the guard makes every path a no-op
# unless the version is actually new.
name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing + provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Is this version new?
        id: check
        run: |
          PUBLISHED=$(npm view bubble-sheet version 2>/dev/null || echo "none")
          CURRENT=$(node -p "require('./package.json').version")
          echo "published=$PUBLISHED current=$CURRENT"
          if [ "$PUBLISHED" = "$CURRENT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already on npm; nothing to publish."
          fi
      # Trusted publishing needs npm 11.5+
      - if: steps.check.outputs.skip != 'true'
        run: npm install -g npm@latest
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npm publish
