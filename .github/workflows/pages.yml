# Deploys the demo to GitHub Pages on every push to main.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# The site then lives at https://mgaspari.github.io/bubble-sheet/
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # The demo loads ../dist/... so the site mirrors the repo layout.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r demo dist examples _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=demo/index.html">
          <a href="demo/index.html">Open the demo</a>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
